# fly.toml app configuration file for deepgram-java-flux-tts
#
# See https://fly.io/docs/reference/configuration/ for details.
#
# NOTE: This deploys the backend service only. Once the frontend submodule
# (flux-tts-html) exists, switch to the Caddy + frontend multi-stage build used
# by the java-flux starter and set internal_port = 8080.

app = 'deepgram-java-flux-tts'
primary_region = 'iad'

[build]
  dockerfile = "deploy/Dockerfile"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
